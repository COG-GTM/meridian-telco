<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Meridian OSS - Invoice Register</title>
<style>
body { font-family: Verdana, Geneva, sans-serif; font-size: 12px; margin: 0; background: #eceff1; color: #102027; }
h1 { background: #1b3a4b; color: #fff; margin: 0; padding: 14px 18px; font-size: 16px; letter-spacing: 1px; }
.wrap { padding: 18px; }
table { border-collapse: collapse; background: #fff; width: 100%; }
th { background: #cfd8dc; text-align: left; padding: 5px 8px; font-size: 11px; }
td { padding: 4px 8px; border-top: 1px solid #eceff1; }
td.num { text-align: right; }
.err { color: #b71c1c; }
.tot { font-weight: bold; background: #fffde7; }
.filters { margin-bottom: 10px; }
.filters input { width: 180px; }
</style>
</head>
<body>
<h1>MERIDIAN OSS &mdash; INVOICE REGISTER</h1>
<div class="wrap">
  <p class="filters">
    Period: <select id="period"><option>2026-07</option><option>2026-06</option></select>
    &nbsp; Account: <input id="acct" placeholder="ACCT_ID or blank for all">
    &nbsp; API key: <input id="key" type="password" autocomplete="off" placeholder="invoice-api bearer token">
    <button id="go">SHOW</button>
  </p>
  <p id="err" class="err"></p>
  <table>
    <thead><tr>
      <th>ACCT_ID</th><th>CUST_NM</th><th>PRV</th><th>USAGE_MB</th><th>OVERAGE_GB</th>
      <th>RECURRING</th><th>OVERAGE</th><th>SUBTOTAL</th><th>LOYALTY</th><th>TAX</th><th>TOTAL</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
var API = "http://localhost:8082";
function money(v) { return "$" + v.toFixed(2); }
function taxCell(i) {
  var parts = [i.FED_TAX_LBL + " " + money(i.FED_TAX)];
  if (i.PROV_TAX_LBL) parts.push(i.PROV_TAX_LBL + " " + money(i.PROV_TAX));
  return parts.join(" + ");
}
function load() {
  var p = document.getElementById("period").value;
  var acct = document.getElementById("acct").value.trim();
  var key = document.getElementById("key").value.trim();
  if (!key) { document.getElementById("err").textContent = "enter an invoice-api key"; return; }
  sessionStorage.setItem("invoiceApiKey", key);
  var url = API + "/invoices?period=" + p + (acct ? "&acct=" + encodeURIComponent(acct) : "");
  fetch(url, { headers: { "Authorization": "Bearer " + key } }).then(function (r) {
    if (r.status === 401) throw "invoice-api rejected the key";
    if (r.status === 403) throw "this key is not entitled to that account";
    return r.json();
  }).then(function (d) {
    var html = "", total = 0;
    d.invoices.forEach(function (i) {
      total += i.INVOICE_TOTAL;
      html += "<tr><td>" + i.ACCT_ID + "</td><td>" + i.CUST_NM + "</td><td>" + i.PROVINCE +
              "</td><td class='num'>" + i.USAGE_MB + "</td><td class='num'>" + i.OVERAGE_GB +
              "</td><td class='num'>" + money(i.RECURRING) + "</td><td class='num'>" + money(i.OVERAGE_CHARGES) +
              "</td><td class='num'>" + money(i.SUBTOTAL) + "</td><td class='num'>-" + money(i.LOYALTY) +
              "</td><td class='num'>" + taxCell(i) + "</td><td class='num'>" + money(i.INVOICE_TOTAL) + "</td></tr>";
    });
    html += "<tr class='tot'><td colspan='10'>TOTAL BILLED</td><td class='num'>" + money(total) + "</td></tr>";
    document.getElementById("rows").innerHTML = html;
    document.getElementById("err").textContent = "";
  }).catch(function (e) {
    document.getElementById("rows").innerHTML = "";
    document.getElementById("err").textContent = typeof e === "string" ? e : "invoice-api unreachable on :8082 (" + e + ")";
  });
}
document.getElementById("key").value = sessionStorage.getItem("invoiceApiKey") || "";
document.getElementById("period").onchange = load;
document.getElementById("go").onclick = load;
load();
</script>
</body>
</html>
