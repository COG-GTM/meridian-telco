name: build

on:
  push:
    branches: [main, java21-modernization]
  pull_request:

jobs:
  java:
    name: java 21 (maven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  # Legacy fallback stays green until Phase 5 decommission: binaries must still match contracts/.
  legacy-contracts:
    name: legacy C++ vs frozen contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: tools/legacy/capture-contracts.sh --check
