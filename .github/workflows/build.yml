name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev python3-pytest
      - run: make
      - run: make check
      - run: cd billing-rules && python3 -m pytest -q
      - run: ./bin/mediation --data data --db meridian.db
