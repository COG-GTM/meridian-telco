name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  make:
    runs-on: ubuntu-latest
    env:
      RULES_TOKEN: ${{ secrets.TELCO_CAPACITY_RULES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure access to telco-capacity-rules
        if: ${{ env.RULES_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${RULES_TOKEN}@github.com/COG-GTM/telco-capacity-rules".insteadOf "https://github.com/COG-GTM/telco-capacity-rules"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make
      - run: ./bin/mediation --data data --db meridian.db
