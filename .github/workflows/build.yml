name: build

on:
  push:
    branches: [main, java21-modernization]
  pull_request:

jobs:
  java:
    name: java 21 (maven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - name: packaged billing-run vs frozen register
        run: |
          jar=$(ls services/billing-service/target/billing-service-*.jar | grep -v '\.original$')
          for p in 2026-06 2026-07; do
            java -jar "$jar" billing-run --period "$p" > "register-$p.txt"
            java -jar "$jar" billing-run --period "$p" --json > "register-$p.jsonl"
            cmp "register-$p.txt" "contracts/register/register-$p.txt"
            cmp "register-$p.jsonl" "contracts/register/register-$p.jsonl"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
