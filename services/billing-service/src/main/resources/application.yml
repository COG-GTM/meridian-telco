server:
  port: 8082
spring:
  application:
    name: billing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${BILLING_DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${BILLING_DB_USER:billing}
    password: ${BILLING_DB_PASSWORD:billing}
  web:
    resources:
      add-mappings: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
meridian:
  kafka:
    # off by default: the service starts with only its Postgres
    enabled: ${MERIDIAN_KAFKA_ENABLED:false}
    group-id: billing-service
  billing:
    seed:
      # optional bootstrap from the legacy flat files (empty = off)
      accounts-dir: ${BILLING_SEED_ACCOUNTS_DIR:}
      usage-csv: ${BILLING_SEED_USAGE_CSV:}
